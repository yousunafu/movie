name: 動画を生成

on:
  workflow_dispatch:
    inputs:
      gist_url:
        description: "台本のGist Raw URL (またはリポジトリ内のパス 例: docs/ashi-sample-script.txt)"
        required: true
        type: string
      preset:
        description: "作風 (genki=健康解説 / ashi=夜の教養エッセイ / manabi=身近な科学の図解 / rekishi=歴史の資料図版)"
        required: true
        type: choice
        default: genki
        options:
          - genki
          - ashi
          - manabi
          - rekishi

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 日本語フォントとffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk ffmpeg

      - name: 依存関係
        run: npm ci

      - name: VOICEVOXエンジンを起動 (無料の日本語音声)
        run: |
          docker run -d --name voicevox -p 50021:50021 voicevox/voicevox_engine:cpu-latest
          echo "エンジンの起動を待っています..."
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:50021/version > /dev/null; then
              echo "VOICEVOX起動完了 (version: $(curl -s http://127.0.0.1:50021/version))"
              exit 0
            fi
            sleep 2
          done
          echo "VOICEVOXの起動がタイムアウトしました"
          docker logs voicevox | tail -50
          exit 1

      - name: 工程1-5 台本読込・絵づけ・補正・画像生成・音声合成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # AI画像は一旦オフ (使うときは下の行の先頭の「# 」を消す)
          # GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          VOICEVOX_URL: http://127.0.0.1:50021
          SCRIPT_URL: ${{ inputs.gist_url }}
          PRESET: ${{ inputs.preset }}
        run: npm run generate -- "$SCRIPT_URL"

      - name: 工程6 映像の書き出し
        run: npx remotion render Main out/video.mp4

      - name: プレビュー画像 (20コマを並べた一覧)
        run: |
          D=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 out/video.mp4)
          I=$(awk "BEGIN{v=$D/20; if(v<0.5)v=0.5; print v}")
          ffmpeg -loglevel error -i out/video.mp4 \
            -vf "fps=1/$I,scale=480:270,tile=5x4" -frames:v 1 out/preview.png

      - name: 成果物の保存
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            out/video.mp4
            out/preview.png
            src/remotion/scenes-data.json
          retention-days: 14
